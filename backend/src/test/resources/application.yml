spring:
  application:
    name: backend
  datasource:
    url: jdbc:h2:mem:markly-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

server:
  port: 0

app:
  jwt:
    secret: test-only-secret-must-be-at-least-32-bytes-long
    expiration-minutes: 480
  seed-admin:
    username: admin
    password: admin12345
  seed-demo-data:
    enabled: false

cors:
  allowed-origin: http://localhost:5173
