spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:markly}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  seed-admin:
    username: ${SEED_ADMIN_USERNAME:admin}
    password: ${SEED_ADMIN_PASSWORD}
  seed-demo-data:
    enabled: ${SEED_DEMO_DATA:false}

cors:
  allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
