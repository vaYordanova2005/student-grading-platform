spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:markly}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-only-secret-must-be-at-least-32-bytes-long}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  seed-admin:
    username: ${SEED_ADMIN_USERNAME:admin}
    password: ${SEED_ADMIN_PASSWORD:admin12345}

cors:
  allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
